name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-pages
  cancel-in-progress: true

env:
  PROJECT_NAME: vaihingen-portal

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Secrets CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID fehlen (Repo → Settings → Secrets and variables → Actions)."
            exit 1
          fi
          # Legt das Pages-Projekt beim ersten Lauf an; existiert es schon, ist der Fehler harmlos.
          npx --yes wrangler@4 pages project create "$PROJECT_NAME" --production-branch=main || true
          npx --yes wrangler@4 pages deploy dist --project-name="$PROJECT_NAME" --branch=main --commit-dirty=true
